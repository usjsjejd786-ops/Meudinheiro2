<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transações — MeuDinheiro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="app-nav">
      <div class="marca"><span class="marca-cifrao">$</span> MeuDinheiro</div>
      <nav class="nav-links">
        <a href="dashboard.html">Painel</a>
        <a href="transacoes.html">Transações</a>
        <a href="perfil.html">Perfil</a>
      </nav>
      <div class="nav-usuario">
        <div class="nome-usuario" data-nome-usuario>Carregando...</div>
        <button class="botao botao-secundario botao-bloco" data-botao-sair>Sair</button>
      </div>
    </aside>

    <main class="app-main">
      <div class="cabecalho-pagina">
        <div>
          <h1>Transações</h1>
          <p class="saudacao">Todos os seus lançamentos, em um só lugar.</p>
        </div>
        <button class="botao botao-primario" id="botao-nova-transacao">+ Nova transação</button>
      </div>

      <form class="barra-filtros" id="form-filtros">
        <div class="campo">
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo" name="tipo">
            <option value="">Todos</option>
            <option value="entrada">Entrada</option>
            <option value="gasto">Gasto</option>
          </select>
        </div>

        <div class="campo">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria" name="categoria">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="campo">
          <label for="filtro-inicio">De</label>
          <input type="date" id="filtro-inicio" name="dataInicio" />
        </div>

        <div class="campo">
          <label for="filtro-fim">Até</label>
          <input type="date" id="filtro-fim" name="dataFim" />
        </div>

        <div class="campo campo-acao">
          <button type="submit" class="botao botao-secundario">Filtrar</button>
        </div>
        <div class="campo campo-acao">
          <button type="button" class="botao botao-texto" id="botao-limpar-filtros">Limpar</button>
        </div>
      </form>

      <section class="painel">
        <div class="lista-transacoes" id="lista-transacoes">
          <div class="estado-vazio">Carregando transações...</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal: criar/editar transação -->
  <div class="sobreposicao-modal" id="sobreposicao-transacao">
    <div class="modal">
      <div class="modal-cabecalho">
        <h2 id="titulo-modal">Nova transação</h2>
        <button class="fechar-modal" data-fechar-modal aria-label="Fechar">&times;</button>
      </div>

      <div id="mensagem-modal" class="mensagem" role="alert"></div>

      <form id="form-transacao" novalidate>
        <input type="hidden" id="transacao-id" />

        <div class="campo">
          <label>Tipo</label>
          <div class="grupo-radio">
            <label class="opcao-radio" data-opcao-tipo="entrada">
              <input type="radio" name="type" value="entrada" checked /> Entrada
            </label>
            <label class="opcao-radio" data-opcao-tipo="gasto">
              <input type="radio" name="type" value="gasto" /> Gasto
            </label>
          </div>
        </div>

        <div class="campo">
          <label for="amount">Valor (R$)</label>
          <input type="number" id="amount" name="amount" step="0.01" min="0.01" required />
        </div>

        <div class="campo">
          <label for="category">Categoria</label>
          <select id="category" name="category" required></select>
        </div>

        <div class="campo">
          <label for="date">Data</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="campo">
          <label for="description">Descrição (opcional)</label>
          <input type="text" id="description" name="description" maxlength="140" />
        </div>

        <div class="modal-acoes">
          <button type="button" class="botao botao-secundario" data-fechar-modal>Cancelar</button>
          <button type="submit" class="botao botao-primario" id="botao-salvar-transacao">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/transacoes.js"></script>
</body>
</html>
